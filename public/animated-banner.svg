<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sefat Ullah Fahad - Full Stack Web Developer</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220">
        <animate attributeName="stop-color" values="#0B1220;#0F1A33;#122347;#0F1A33;#0B1220" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#122347">
        <animate attributeName="stop-color" values="#122347;#1B3A73;#1E4488;#1B3A73;#122347" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0B1220">
        <animate attributeName="stop-color" values="#0B1220;#0F1A33;#122347;#0F1A33;#0B1220" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes floatUp {
        0%   { transform: translateY(0px); opacity: 0.2; }
        50%  { transform: translateY(-16px); opacity: 0.65; }
        100% { transform: translateY(0px); opacity: 0.2; }
      }
      @keyframes flowDash {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes fadeSlide {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes breatheGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50%      { opacity: 0.55; transform: scale(1.12); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; r: 2.5; }
        50%      { opacity: 1; r: 4; }
      }
      @keyframes blink {
        0%, 45%  { opacity: 1; }
        50%, 95% { opacity: 0; }
        100%     { opacity: 1; }
      }
      @keyframes underlineGrow {
        0%   { stroke-dashoffset: 260; }
        45%  { stroke-dashoffset: 0; }
        55%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -260; }
      }
      @keyframes driftSlow {
        0%, 100% { transform: translateX(0px); }
        50%      { transform: translateX(24px); }
      }

      .particle { animation: floatUp 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: 0.7s; }
      .p3 { animation-delay: 1.4s; }
      .p4 { animation-delay: 2.1s; }
      .p5 { animation-delay: 1.0s; }
      .p6 { animation-delay: 2.8s; }
      .p7 { animation-delay: 0.4s; }
      .p8 { animation-delay: 1.9s; }

      .glowdot { animation: pulseGlow 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

      .circuit { stroke-dasharray: 8 6; animation: flowDash 3s linear infinite; }
      .circuit2 { animation-delay: -1.2s; }

      .orb { animation: breatheGlow 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .orbA { animation-delay: 0s; }
      .orbB { animation-delay: 2.5s; }

      .headline { opacity: 0; animation: fadeSlide 0.8s ease-out 0.2s forwards; }
      .subline  { opacity: 0; animation: fadeSlide 0.8s ease-out 0.55s forwards; }
      .badge    { opacity: 0; animation: fadeSlide 0.8s ease-out 0.9s forwards; }

      .cursor { animation: blink 1.1s step-end infinite; }
      .underline { stroke-dasharray: 260; animation: underlineGrow 4.5s ease-in-out infinite; }
      .driftGroup { animation: driftSlow 10s ease-in-out infinite; transform-box: fill-box; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Soft breathing light orbs for extra depth/movement -->
  <circle class="orb orbA" cx="180" cy="150" r="110" fill="url(#orbGrad)"/>
  <circle class="orb orbB" cx="1020" cy="150" r="110" fill="url(#orbGrad)"/>

  <!-- Flowing circuit lines (continuous, no snap/jerk on loop) -->
  <path class="circuit" d="M -50 250 L 200 250 L 240 210 L 500 210 L 540 250 L 1250 250"
        fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <path class="circuit circuit2" d="M -50 60 L 180 60 L 210 90 L 460 90 L 500 60 L 1250 60"
        fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>

  <!-- Slowly drifting particle field -->
  <g class="driftGroup">
    <circle class="particle p1 glowdot" cx="120" cy="70" r="3" fill="#60A5FA"/>
    <circle class="particle p2 glowdot" cx="1080" cy="90" r="3.5" fill="#3B82F6"/>
    <circle class="particle p3 glowdot" cx="150" cy="230" r="2.5" fill="#93C5FD"/>
    <circle class="particle p4 glowdot" cx="1060" cy="235" r="3" fill="#3B82F6"/>
    <circle class="particle p5 glowdot" cx="600" cy="45" r="2.5" fill="#60A5FA"/>
    <circle class="particle p6 glowdot" cx="620" cy="260" r="2.5" fill="#93C5FD"/>
    <circle class="particle p7 glowdot" cx="340" cy="120" r="2" fill="#60A5FA"/>
    <circle class="particle p8 glowdot" cx="860" cy="180" r="2" fill="#93C5FD"/>
  </g>

  <text x="600" y="140" text-anchor="middle" class="headline"
        font-family="Fira Code, Consolas, monospace" font-size="46" font-weight="700" fill="url(#textGrad)">
    Sefat Ullah Fahad<tspan class="cursor" fill="#60A5FA">|</tspan>
  </text>

  <text x="600" y="180" text-anchor="middle" class="subline"
        font-family="Fira Code, Consolas, monospace" font-size="20" font-weight="500" fill="#CBD5E1">
    Full Stack Web Developer · MERN &amp; Next.js Specialist
  </text>

  <!-- Animated underline sweeping beneath the subtitle -->
  <line x1="470" y1="192" x2="730" y2="192" class="underline" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>

  <g class="badge">
    <rect x="430" y="205" width="340" height="34" rx="17" fill="#122347" stroke="#3B82F6" stroke-width="1"/>
    <text x="600" y="227" text-anchor="middle" font-family="Fira Code, Consolas, monospace"
          font-size="13" fill="#93C5FD">
      Building scalable web apps, end to end
    </text>
  </g>
</svg>
